name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # checkout v5 وsetup-python v6 أول نسختين على Node 24
      # (v4/v5 كانتا على Node 20 — تحذير الإهمال في #247).
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # numpy: الكشف البكسلي في qa_safe_area (lib/check.py)
      # يحتاجها؛ غيابها في التشغيل #255 أسقط 5 اختبارات
      # TestQaSafeAreaBands بـModuleNotFoundError و3 اختبارات
      # فيديو QA بـ«True is not false» — الفحص يُتخطى بلا
      # numpy فيُرجع qa ‏ok=True.
      - name: Install dependencies
        run: pip install pyyaml pillow numpy
      # أدوات الفيديو الرخيصة: معظم الاختبارات تستدعي ffmpeg/ffprobe
      # مباشرةً (بلا محاكاة)، فغيابها كان يُسقط ~50 اختبارًا بـ
      # FileNotFoundError. melt خلفية تجميع بديلة — تثبيته
      # اختياري (best-effort): اختباراته تتخطى نظيفًا عند غيابه.
      - name: Install video tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      # خط Noto Naskh Arabic: اختبارات MoviePy وبطاقات الاقتباس
      # ترسم به (lib/moviepy_fx.py وmake_quote_cards.py)؛ غيابه
      # أسقطها في #247. الحزمة نفسها التي يقترحها doctor.
      - name: Install Arabic font
        run: sudo apt-get install -y fonts-noto-core
      - name: Install melt (best-effort)
        run: sudo apt-get install -y melt || echo "melt not available — melt tests will skip"
      - name: Compile check
        run: python -m py_compile studio.py lib/*.py tests/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
